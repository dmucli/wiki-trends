name: Daily edition

on:
  # Scheduled runs are turned off. Run the workflow by hand from the Actions tab when you want an edition.
  workflow_dispatch:
    inputs:
      date:
        description: "Pageviews day(s), space-separated YYYY-MM-DD; default yesterday UTC"
        required: false
      limit:
        description: "Articles per edition"
        required: false
        default: "25"

permissions:
  contents: write

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Pick dates
        id: date
        run: |
          D="${{ inputs.date }}"
          [ -z "$D" ] && D=$(date -u -d yesterday +%F)
          TODO=""
          for d in $D; do
            # Scheduled retries skip days that are already published; manual runs always regenerate.
            if [ "${{ github.event_name }}" = "schedule" ] && [ -f "content/en/$d/index.json" ] && [ -f "content/fr/$d/index.json" ]; then continue; fi
            TODO="$TODO $d"
          done
          echo "dates=$TODO" >> "$GITHUB_OUTPUT"
          [ -z "$TODO" ] && echo "skip=true" >> "$GITHUB_OUTPUT" || true

      - name: Generate editions
        id: gen
        if: steps.date.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WIKI_USER_AGENT: ${{ vars.WIKI_USER_AGENT || vars.EMAIL }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::error::ANTHROPIC_API_KEY secret is not set"; exit 1; fi
          # Keep going past a failed day so finished days still get committed; the last step fails the run.
          FAILED=""
          for d in ${{ steps.date.outputs.dates }}; do
            npm run daily -- --date "$d" --limit "${{ inputs.limit || '25' }}" || FAILED="$FAILED $d"
          done
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

      - name: Build check
        if: steps.date.outputs.skip != 'true'
        run: npm run build

      - name: Commit
        if: steps.date.outputs.skip != 'true'
        run: |
          git config user.name "wiki-trends-bot"
          git config user.email "wiki-trends-bot@users.noreply.github.com"
          git add content
          git diff --cached --quiet || git commit -m "Edition${{ steps.date.outputs.dates }}"
          git push

      - name: Report failed days
        if: steps.gen.outputs.failed != ''
        run: |
          echo "::error::These days failed and were not (fully) published:${{ steps.gen.outputs.failed }}"
          exit 1
