*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:1.0625rem;line-height:1.55}
a{color:inherit;text-underline-offset:.18em;text-decoration-thickness:1px}

.wrap{max-width:60rem;margin:0 auto;padding:2.5rem 1.25rem 4rem}

.filters button .n{color:var(--soft);font-variant-numeric:tabular-nums}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

ol.list{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:3.2rem minmax(0,1fr) 12rem;column-gap:1rem;padding:1.6rem 0;border-top:1px solid var(--line)}
.rank{font-family:var(--display);font-weight:750;font-size:2rem;line-height:1;letter-spacing:-.03em;color:var(--c);font-variant-numeric:tabular-nums;padding-top:.15rem}
.item h2{font-family:var(--display);font-weight:650;font-size:1.45rem;line-height:1.15;letter-spacing:-.015em;margin:0 0 .45rem}
.item h2 a{text-decoration:none}
.item h2 a:hover{text-decoration:underline}
.meta{font-family:var(--display);font-size:.875rem;color:var(--soft);margin:0 0 .7rem;display:flex;flex-wrap:wrap;gap:.3rem 1rem;align-items:center}
.chip{color:var(--c);font-weight:650;display:inline-flex;align-items:center;gap:.4rem}
.chip::before{content:"";width:.55rem;height:.55rem;border-radius:50%;background:var(--c)}
.what{margin:0 0 .55rem;max-width:36rem;color:var(--soft)}
.why{margin:0 0 .7rem;max-width:36rem}
.what b,.why b{font-family:var(--display);font-size:.84rem;font-weight:650;color:var(--c);margin-right:.25rem}
.conf{font-family:var(--display);font-size:.84rem;color:var(--soft);margin:0}
.conf b{font-weight:650;color:var(--ink)}
.spark{align-self:start;padding-top:.3rem}
.spark svg{display:block;width:100%;height:auto;overflow:visible}
.spark figcaption{font-family:var(--display);font-size:.78rem;color:var(--soft);margin-top:.35rem}
figure{margin:0}

footer{border-top:1px solid var(--line);margin-top:.5rem;padding-top:1.5rem;color:var(--soft);font-size:.98rem;max-width:40rem}
footer p{margin:0 0 .8rem}
.empty{padding:2rem 0;color:var(--soft)}

@media (max-width:640px){
  .wrap{padding-top:1.75rem}
  .item{grid-template-columns:2.4rem minmax(0,1fr);row-gap:.9rem}
  .rank{font-size:1.5rem}
  .spark{grid-column:2;max-width:15rem}
  .item h2{font-size:1.3rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.top{display:flex;justify-content:flex-end;margin-bottom:1.6rem}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.lang button{appearance:none;border:0;background:transparent;color:var(--soft);font-family:var(--display);font-size:.9rem;font-weight:550;padding:.38rem .9rem .4rem;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.item.nochart{grid-template-columns:3.2rem minmax(0,1fr)}
.item.nochart .why,.item.nochart .what{max-width:42rem}
@media (max-width:640px){.item.nochart{grid-template-columns:2.4rem minmax(0,1fr)}}

const ED = {
  en:{
    lang:"en", wiki:"https://en.wikipedia.org/wiki/", data:DATA_EN, src:S_EN, history:true,
    title:"Why is Wikipedia reading this?",
    sub:"The 25 most-read articles on English Wikipedia on Wednesday 30 September 2026, each with the reason people went looking.",
    lblWhat:"What it is",lblWhy:"Why now",share:"Where the day's top-25 views went", all:"All", views:"views", sources:"Sources:", chart:"21 to 30 September",
    rank:"Rank", filter:"Filter by reason", pct:"of views", empty:"Nothing in this group today. Choose All to see the full list.",
    off:"outside top 100", daily:"Daily views",
    cats:{news:"Current events",sport:"Sport",screen:"Film and TV",death:"Deaths",viral:"Viral moment",evergreen:"Always popular",mystery:"Unexplained traffic"},
    conf:{confirmed:"Confirmed",likely:"Likely",guess:"Best guess",unsolved:"Unsolved"},
    foot:["Rankings and daily view counts come from Wikimedia's pageview data, read through the Hatnote Top 100. Each small chart covers 21 to 30 September. A gap in the line means the article was outside the top 100 that day, not that nobody read it.",
          "The explanations were researched from news coverage on 1 October 2026. Where no cause turned up, the entry says so instead of guessing.",
          "This page shows one day. Ask Claude in the chat for a new edition and the list gets rebuilt for the latest date."],
    fmt:n=> n>=1e6 ? (n/1e6).toFixed(2).replace(/0$/,"")+"M" : Math.round(n/1e3)+"K"
  },
  fr:{
    lang:"fr", wiki:"https://fr.wikipedia.org/wiki/", data:DATA_FR, src:S_FR, history:false,
    title:"Pourquoi Wikipédia lit ça ?",
    sub:"Les 25 articles les plus lus de Wikipédia en français le mercredi 30 septembre 2026, avec pour chacun la raison qui a poussé les gens à venir le lire.",
    lblWhat:"C'est quoi ?",lblWhy:"Pourquoi maintenant ?",share:"Où sont parties les vues du top 25", all:"Tout", views:"vues", sources:"Sources :", chart:"",
    rank:"Rang", filter:"Filtrer par raison", pct:"des vues", empty:"Rien dans ce groupe aujourd'hui. Choisissez Tout pour revoir la liste complète.",
    off:"", daily:"",
    cats:{news:"Actualité",sport:"Sport",screen:"Télé et cinéma",death:"Décès",viral:"Moment viral",evergreen:"Toujours populaires",mystery:"Trafic inexpliqué"},
    conf:{confirmed:"Confirmé",likely:"Probable",guess:"Hypothèse",unsolved:"Non résolu"},
    foot:["Le classement et les vues viennent des statistiques de consultation de Wikimedia, lues via le Top 100 de Hatnote. Pour l'édition française, Hatnote ne fournit pas encore l'historique jour par jour. Il n'y a donc pas de petites courbes ici.",
          "Les explications ont été recherchées dans la presse le 1er octobre 2026. Quand je n'ai pas trouvé de cause, c'est écrit noir sur blanc.",
          "Cette page montre une seule journée. Demandez une nouvelle édition à Claude dans la conversation pour la mettre à jour."],
    fmt:n=> n>=1e6 ? (n/1e6).toFixed(2).replace(".",",")+" M" : Math.round(n/1e3)+" k"
  }
};
const CATV = {news:"--news",sport:"--sport",screen:"--screen",death:"--death",viral:"--viral",evergreen:"--evergreen",mystery:"--mystery"};
const DAYS = ["21 Sep","22 Sep","23 Sep","24 Sep","25 Sep","26 Sep","27 Sep","28 Sep","29 Sep","30 Sep"];

const esc = s => String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
// French typography: non-breaking spaces before high punctuation and inside guillemets
const typo = (s, lang) => lang==="fr" ? s.replace(/ ([?!:;»])/g,"\u00a0$1").replace(/« /g,"«\u00a0").replace(/(\d) (h|k|M|%)(?=\W|$)/g,"$1\u00a0$2") : s;
const views = x => x.v ?? x.d[9];

function spark(d, color, E){
  const W=200,H=56,p=5, max=Math.max(...d);
  const x=i=>p+i*(W-2*p)/(d.length-1), y=v=>H-p-(v/max)*(H-2*p);
  let paths="", seg=[], dots="";
  const flush=()=>{ if(seg.length>1) paths+=`<polyline points="${seg.join(" ")}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
                    else if(seg.length===1){const [a,b]=seg[0].split(","); dots+=`<circle cx="${a}" cy="${b}" r="2.4" fill="${color}"/>`;} seg=[]; };
  d.forEach((v,i)=>{ if(v>0) seg.push(x(i).toFixed(1)+","+y(v).toFixed(1)); else flush(); });
  flush();
  const lx=x(d.length-1), ly=y(d[d.length-1]);
  const label=E.daily+", "+d.map((v,i)=>DAYS[i]+": "+(v? v.toLocaleString("en-US"):E.off)).join("; ");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">
    <line x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/>
    ${paths}${dots}<circle cx="${lx}" cy="${ly}" r="4" fill="${color}"/></svg>`;
}

let lang = "en", active = null;
try { const saved = localStorage.getItem("wiki-why-lang"); if (saved === "fr" || saved === "en") lang = saved; } catch(e) {}

const $ = id => document.getElementById(id);
const list=$("list"), bar=$("bar"), filters=$("filters");

function totals(E){
  const out={}; E.data.forEach(x=>{ const o=out[x.c]||(out[x.c]={views:0,n:0}); o.views+=views(x); o.n++; });
  return Object.entries(out).sort((a,b)=>b[1].views-a[1].views);
}
function renderChrome(){
  const E=ED[lang];
  document.documentElement.lang=E.lang; document.title=E.title;
  $("h1").textContent=typo(E.title,lang); $("sub").textContent=typo(E.sub,lang);
  $("shareTitle").textContent=E.share;
  filters.setAttribute("aria-label",E.filter);
  $("foot").innerHTML=E.foot.map(p=>`<p>${esc(typo(p,lang))}</p>`).join("");
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.lang===lang)));
}
function renderControls(){
  const E=ED[lang], t=totals(E), sum=t.reduce((a,[,o])=>a+o.views,0);
  bar.className="bar"+(active?" filtered":"");
  bar.innerHTML=t.map(([c,o])=>`<button type="button" tabindex="-1" aria-hidden="true" class="${active===c?"on":""}" data-c="${c}" style="--c:var(${CATV[c]});flex:${o.views} 1 0" title="${esc(E.cats[c])}: ${Math.round(o.views/sum*100)}% ${E.pct}"></button>`).join("");
  filters.innerHTML=`<button type="button" data-c="" aria-pressed="${!active}">${E.all} <span class="n">${E.data.length}</span></button>`+
    t.map(([c,o])=>`<button type="button" data-c="${c}" aria-pressed="${active===c}" style="--c:var(${CATV[c]})"><span class="dot"></span>${esc(E.cats[c])} <span class="n">${o.n}</span></button>`).join("");
}
function renderList(){
  const E=ED[lang];
  const rows=E.data.map((x,i)=>({...x,rank:i+1})).filter(x=>!active||x.c===active);
  list.innerHTML=rows.map(x=>{
    const cv=`var(${CATV[x.c]})`;
    const src=x.s.length?" "+esc(typo(E.sources,lang))+" "+x.s.map(k=>`<a href="${E.src[k][1]}" target="_blank" rel="noopener">${esc(E.src[k][0])}</a>`).join(", ")+".":"";
    const chart=E.history?`<figure class="spark">${spark(x.d,cv,E)}<figcaption>${E.chart}</figcaption></figure>`:"";
    return `<li class="item${E.history?"":" nochart"}" style="--c:${cv}">
      <div class="rank" aria-label="${E.rank} ${x.rank}">${x.rank}</div>
      <div class="main">
        <h2><a href="${E.wiki+encodeURIComponent(x.t.replace(/ /g,"_"))}" target="_blank" rel="noopener">${esc(x.t)}</a></h2>
        <p class="meta"><span class="chip">${esc(E.cats[x.c])}</span><span>${typo(E.fmt(views(x))+" "+E.views,lang)}</span>${x.streak?`<span>${esc(x.streak)}</span>`:""}</p>
        <p class="what"><b>${esc(typo(E.lblWhat,lang))}</b> ${esc(typo(x.w,lang))}</p>
        <p class="why"><b>${esc(typo(E.lblWhy,lang))}</b> ${esc(typo(x.why,lang))}</p>
        <p class="conf"><b>${E.conf[x.k]}.</b>${src}</p>
      </div>${chart}
    </li>`;
  }).join("")||`<li class="empty">${esc(E.empty)}</li>`;
}
function setFilter(c){ active=c||null; renderControls(); renderList(); }
function setLang(l){ lang=l; active=null; try{localStorage.setItem("wiki-why-lang",l);}catch(e){} renderChrome(); renderControls(); renderList(); }

filters.addEventListener("click", e=>{ const b=e.target.closest("button"); if(b){ setFilter(b.dataset.c); const f=filters.querySelector('[aria-pressed="true"]'); if(f) f.focus(); } });
bar.addEventListener("click", e=>{ const b=e.target.closest("button"); if(b) setFilter(active===b.dataset.c?"":b.dataset.c); });
document.querySelector(".lang").addEventListener("click", e=>{ const b=e.target.closest("button"); if(b && b.dataset.lang!==lang) setLang(b.dataset.lang); });
renderChrome(); renderControls(); renderList();
</script>
